# Usage (from the repository root):
#   docker compose -f docker/compose.yaml up --build -d
# Edit examples/heplify.json (or point the bind mount at your own copy) first.

services:
  heplify:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sipcapture/heplify:latest
    container_name: heplify
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ../examples/heplify.json:/etc/heplify/heplify.json:ro
      - heplify-data:/var/lib/heplify
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  heplify-data:
