name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  # Go minor version used for builds; setup-go picks its latest patch.
  GO_VERSION: "1.26.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the Go minor version: go.mod pins only the minimum, and
          # building with that exact release ships stdlib bugs fixed since.
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Download Go modules
        run: go mod download

      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make lint

      - name: Unit tests
        run: make test

      - name: Race tests
        run: make test-race

      - name: Coverage
        run: make test-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of the Go minor version: go.mod pins only the minimum, and
          # building with that exact release ships stdlib bugs fixed since.
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Download Go modules
        run: go mod download

      - name: gofmt check
        run: make fmt-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          args: --timeout=5m

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      # Fails on known vulnerabilities in reachable code, stdlib included.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Informational for now: report findings without failing the build.
      - name: gosec
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-dir=examples ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Fuzz parsers (20s each)
        run: ./scripts/fuzz.sh 20s

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian_release: [trixie, bookworm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg DEBIAN_RELEASE=${{ matrix.debian_release }} \
            -t heplify:ci-${{ matrix.debian_release }} .

      - name: Smoke test
        run: |
          docker run --rm --cap-add NET_RAW --cap-add NET_ADMIN heplify:ci-${{ matrix.debian_release }} -version
          # Default capabilities only: the binary must still start.
          docker run --rm heplify:ci-${{ matrix.debian_release }} -version
          test "$(docker run --rm --entrypoint id heplify:ci-${{ matrix.debian_release }} -un)" = homer
