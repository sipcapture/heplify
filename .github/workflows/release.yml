name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.1)'
        required: true
      release:
        description: 'Create GitHub Release and push deb/rpm to Packagecloud (same idea as homer-core)'
        type: boolean
        default: true

# Least privilege by default; jobs that need more declare it.
permissions:
  contents: read

# Serialize runs for the same ref to reduce races.
concurrency:
  group: heplify-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Go minor version used for builds; setup-go picks its latest patch.
  GO_VERSION: "1.26.x"
  IMAGE_NAME: ghcr.io/sipcapture/heplify

jobs:
  # Resolve and validate the version once; every other job reads these outputs.
  # The tag is user-controlled (tag name or workflow_dispatch input): it only
  # reaches shell scripts through env, after the regex check below.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      git_commit: ${{ steps.v.outputs.git_commit }}
      build_date: ${{ steps.v.outputs.build_date }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${TAG}' is not a valid release tag (expected e.g. v2.0.1 or 2.0.1-rc1)."
            exit 1
          fi
          # 'latest' image tag only for stable versions (no pre-release suffix)
          LATEST=true
          case "${VERSION}" in *-*) LATEST=false ;; esac
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "git_commit=${GITHUB_SHA:0:7}"
            echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goos: linux
            runner: ubuntu-latest
          - goarch: arm64
            goos: linux
            runner: ubuntu-24.04-arm
          - goarch: arm64
            goos: darwin
            runner: macos-latest
          - goarch: amd64
            goos: windows
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    env:
      VERSION: ${{ needs.version.outputs.version }}
      GIT_COMMIT: ${{ needs.version.outputs.git_commit }}
      BUILD_DATE: ${{ needs.version.outputs.build_date }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install build dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flex bison

      - name: Install build dependencies (macOS)
        if: matrix.goos == 'darwin'
        run: |
          brew install libpcap

      - name: Install build dependencies (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $npcapUrl = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Invoke-WebRequest -Uri $npcapUrl -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "CGO_CFLAGS=-IC:/npcap-sdk/Include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:/npcap-sdk/Lib/x64 -lwpcap" >> $env:GITHUB_ENV

      - name: Cache local libpcap
        if: matrix.goos == 'linux'
        id: cache-libpcap
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/libpcap
          key: libpcap-1.10.4-${{ matrix.goarch }}-${{ runner.os }}

      - name: Build static libpcap
        if: matrix.goos == 'linux' && steps.cache-libpcap.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_libpcap.sh
          ./scripts/build_libpcap.sh

      - name: Update version.go
        run: |
          sed -i.bak "s|var Version = \"[^\"]*\"|var Version = \"${VERSION}\"|" src/cmd/heplify/version.go
          rm -f src/cmd/heplify/version.go.bak
          grep "var Version" src/cmd/heplify/version.go

      - name: Build heplify (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.BuildDate=${BUILD_DATE} -X main.GitCommit=${GIT_COMMIT}"
          EXT="${{ matrix.goos == 'windows' && '.exe' || '' }}"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} \
            CGO_CFLAGS="-I$(pwd)/build/libpcap/include" \
            CGO_LDFLAGS="-L$(pwd)/build/libpcap/lib" \
            go build \
              -ldflags "${LDFLAGS} -linkmode external -extldflags '-static'" \
              -trimpath \
              -o heplify_${{ matrix.goos }}_${{ matrix.goarch }} \
              ./src/cmd/heplify
          else
            CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "${LDFLAGS}" -trimpath \
              -o heplify_${{ matrix.goos }}_${{ matrix.goarch }}${EXT} \
              ./src/cmd/heplify
          fi

          echo "=== Version dump ==="
          ./heplify_${{ matrix.goos }}_${{ matrix.goarch }}${EXT} -version

      # The deb ships a dynamically linked binary built on Debian 12 (libc and
      # libpcap from the system); the rpm and the release asset stay static.
      - name: Build dynamic binary for the deb
        if: matrix.goos == 'linux'
        run: ./scripts/build_deb_binary.sh heplify_deb_${{ matrix.goarch }}

      - name: Get nfpm
        if: matrix.goos == 'linux'
        run: |
          NFPM_ARCH="${{ matrix.goarch == 'arm64' && 'arm64' || 'x86_64' }}"
          wget -qO- "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_${NFPM_ARCH}.tar.gz" \
            | tar --directory ./ -xz nfpm
          chmod +x nfpm

      - name: Create packages (${{ matrix.goarch }})
        if: matrix.goos == 'linux'
        env:
          ARCH: ${{ matrix.goarch }}
        run: |
          echo "=== Binary types ==="
          file "heplify_deb_${ARCH}" "heplify_linux_${ARCH}"
          BINARY="heplify_deb_${ARCH}" ./nfpm pkg --config nfpm.yaml --target "./heplify_${VERSION}_${ARCH}.deb"
          BINARY="heplify_linux_${ARCH}" ./nfpm pkg --config nfpm.yaml --target "./heplify_${VERSION}_${ARCH}.rpm"
          ls -lh heplify_*.deb heplify_*.rpm heplify_${{ matrix.goos }}_${{ matrix.goarch }}

      # Single Linux artifact per arch: binary + deb + rpm (Packagecloud downloads heplify-linux-*).
      - name: Upload artifacts (Linux)
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heplify-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1
          path: |
            heplify_${{ matrix.goos }}_${{ matrix.goarch }}
            heplify_${{ needs.version.outputs.version }}_${{ matrix.goarch }}.deb
            heplify_${{ needs.version.outputs.version }}_${{ matrix.goarch }}.rpm

      - name: Upload artifacts (macOS)
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heplify-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1
          path: |
            heplify_${{ matrix.goos }}_${{ matrix.goarch }}

      - name: Upload artifacts (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heplify-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1
          path: |
            heplify_${{ matrix.goos }}_${{ matrix.goarch }}.exe

  docker:
    name: Docker image (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    needs: [version, build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check DockerHub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arch-specific image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}-${{ matrix.goarch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_DATE=${{ needs.version.outputs.build_date }}
            GIT_COMMIT=${{ needs.version.outputs.git_commit }}

  docker-manifest:
    name: Docker multi-arch manifest
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LATEST: ${{ needs.version.outputs.latest }}

    steps:
      - name: Check DockerHub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest (GHCR)
        run: |
          TAGS=(--tag "${IMAGE_NAME}:${VERSION}")
          [ "${LATEST}" = "true" ] && TAGS+=(--tag "${IMAGE_NAME}:latest")
          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_NAME}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"

      - name: Create and push multi-arch manifest (Docker Hub)
        if: steps.dockerhub.outputs.available == 'true'
        run: |
          HUB_IMAGE="sipcapture/heplify"
          TAGS=(--tag "${HUB_IMAGE}:${VERSION}")
          [ "${LATEST}" = "true" ] && TAGS+=(--tag "${HUB_IMAGE}:latest")
          docker buildx imagetools create "${TAGS[@]}" \
            "${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_NAME}:${VERSION}-arm64"

  release:
    name: Create GitHub Release
    needs: [version, build]
    # workflow_dispatch can opt out of creating the release (input 'release')
    if: github.event_name != 'workflow_dispatch' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Ensure tag exists
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Flatten artifacts
        run: |
          mkdir -p dist/flat
          find dist/ -type f -exec mv {} dist/flat/ \;
          (cd dist/flat && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .)
          echo "=== Release assets ==="
          ls -lh dist/flat/

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "heplify v${{ needs.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/flat/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep Formula/heplify.rb (the Homebrew tap lives in this repository) in sync
  # with the published release. Stable versions only, and only on the upstream
  # repository: the formula points at its release assets.
  homebrew:
    name: Update Homebrew formula
    needs: release
    # workflow_dispatch can opt out of creating the release (input 'release')
    if: >-
      github.repository == 'sipcapture/heplify' &&
      (github.event_name != 'workflow_dispatch' || inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update formula
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${REF_NAME}"
          fi
          VERSION="${TAG#v}"
          # The tag is user-controlled: only a plain stable version goes any further.
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "'${TAG}' is not a stable release version, formula not updated."
            exit 0
          fi
          current="$(sed -n 's|.*/releases/download/\([^/]*\)/heplify_darwin_arm64.*|\1|p' Formula/heplify.rb)"
          newest="$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -n 1)"
          if [ "${current}" = "${VERSION}" ] || [ "${newest}" != "${VERSION}" ]; then
            echo "Formula is at ${current}, nothing to do for ${VERSION}."
            exit 0
          fi
          # Downloads the published asset: fails if it is missing
          ./scripts/update_formula.sh "${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/heplify.rb
          git commit -m "chore(homebrew): bump formula to ${VERSION}"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${DEFAULT_BRANCH}" && git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
            echo "push failed (attempt ${attempt}/3), retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::could not push the formula update to ${DEFAULT_BRANCH}"
          exit 1

  # Single runner pushes all debs/rpms in order — avoids parallel Packagecloud API races.
  # Same repos as homer-core: qxip/sipcapture/any/any and rpm_any/rpm_any
  #
  # Skip when PACKAGECLOUD_TOKEN is unset or empty (forks, dev repos without Packagecloud).
  # TEMP: push disabled until PACKAGECLOUD_TOKEN is fixed — restore:
  #   success() && secrets.PACKAGECLOUD_TOKEN != '' && (...)
  packagecloud:
    name: Push to Packagecloud
    needs: build
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: read
    env:
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkgs
          pattern: heplify-linux-*
          merge-multiple: true

      - name: Push to Packagecloud (sequential, retries)
        run: |
          set -e
          ls -laR pkgs
          deb_n=$(find pkgs -name '*.deb' | wc -l)
          rpm_n=$(find pkgs -name '*.rpm' | wc -l)
          echo "Artifacts: $deb_n deb, $rpm_n rpm"
          [ "$deb_n" -ge 1 ] && [ "$rpm_n" -ge 1 ] || { echo "::error::missing packages under pkgs/"; exit 1; }
          sudo apt install -y ruby ca-certificates
          sudo update-ca-certificates
          sudo gem install package_cloud
          push_pkg() {
            f="$1"
            repo="$2"
            n=0
            ok=0
            while [ "$n" -lt 2 ]; do
              n=$((n+1))
              if package_cloud push "$repo" "$f"; then
                ok=1
                break
              fi
              echo "package_cloud failed $f (attempt $n/2), sleeping $((n*25))s..."
              sleep $((n*25))
            done
            [ "$ok" = "1" ]
          }
          for deb in $(find pkgs -name '*.deb' | sort); do
            echo "---- $deb ----"
            dpkg-deb -I "$deb" | head -30
            if dpkg-deb -f "$deb" 2>/dev/null | grep -qi '^License:'; then
              echo "::error::deb control still has License: — fix nfpm yaml"
              exit 1
            fi
            push_pkg "$deb" "qxip/sipcapture/any/any"
          done
          for rpm in $(find pkgs -name '*.rpm' | sort); do
            echo "---- $rpm ----"
            push_pkg "$rpm" "qxip/sipcapture/rpm_any/rpm_any"
          done
