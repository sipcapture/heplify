# nfpm package configuration for heplify
# Used by release workflow and scripts/build_package.sh
# VERSION, ARCH and BINARY are passed via environment variables:
#   VERSION=1.2.3 ARCH=amd64 BINARY=heplify nfpm pkg ...
# The deb ships a dynamically linked binary (scripts/build_deb_binary.sh) and
# depends on the system libpcap and libc; the rpm ships the static binary.

name: "heplify"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "net"
priority: "optional"
replaces:
  - heplify
provides:
  - heplify
maintainer: "SIPCAPTURE <support@sipcapture.org>"
description: |
  Next-generation HEP Agent and Collector for the SIPCAPTURE ecosystem.
  Captures SIP, RTCP and other VoIP traffic and forwards it via HEP protocol.
  (AGPL-3.0)
vendor: "SIPCAPTURE"
homepage: "https://github.com/sipcapture/heplify"
# license omitted: nfpm writes "License:" into deb control; Packagecloud may 500.
overrides:
  deb:
    depends:
      # Keep in sync with the binary: scripts/build_deb_binary.sh checks that the
      # libc floor covers the symbols it uses and that nothing else is needed.
      - libc6 (>= 2.34)
      - libpcap0.8 (>= 1.5.1)
contents:
  - src: ./${BINARY}
    dst: /usr/bin/heplify
    expand: true

  - src: ./examples/heplify.json
    dst: /etc/heplify/heplify.json
    type: config|noreplace
    file_info:
      mode: 0640

  - src: ./examples/example.lua
    dst: /etc/heplify/example.lua
    type: config|noreplace

  - src: ./examples/heplify.service
    dst: /usr/lib/systemd/system/heplify.service

  - src: ./examples/heplify.init
    dst: /etc/init.d/heplify
    file_info:
      mode: 0755

scripts:
  postinstall: ./scripts/package/postinstall.sh
  preremove: ./scripts/package/preremove.sh
  postremove: ./scripts/package/postremove.sh
